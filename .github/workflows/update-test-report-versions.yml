name: Update test report versions
on:
  release:
    types: [published, unpublished, deleted]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: test-report-release-versions
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Refresh release options
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_test_report_versions.py
      - name: Commit updated options
        run: |
          if git diff --quiet -- .github/ISSUE_TEMPLATE/test-report.yml; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/ISSUE_TEMPLATE/test-report.yml
          git commit -m 'Update test report release versions'
          git push
