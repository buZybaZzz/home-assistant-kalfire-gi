[project]
name = "home-assistant-kalfire-gi"
version = "0.1.4"
requires-python = ">=3.14.2"
dependencies = ["pyOpenSSL==26.4.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]
